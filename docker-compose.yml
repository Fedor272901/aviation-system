services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: aviation-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD}"
      MSSQL_PID: Express
    volumes:
      - mssql_data:/var/opt/mssql
    networks:
      - aviation-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/1433'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: aviation-backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_HOURS: ${ACCESS_TOKEN_EXPIRE_HOURS:-24}
      DEBUG: ${DEBUG:-false}
      APP_NAME: ${APP_NAME:-Aviation System}
      VERSION: ${VERSION:-1.0.0}
      CORS_ORIGINS: ${CORS_ORIGINS}
      APP_DB_NAME: ${APP_DB_NAME:-AviationDB}
      APP_DB_COLLATION: ${APP_DB_COLLATION:-Cyrillic_General_CI_AS}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_FIRST_NAME: ${ADMIN_FIRST_NAME:-Admin}
      ADMIN_LAST_NAME: ${ADMIN_LAST_NAME:-Root}
      ADMIN_MIDDLE_NAME: ${ADMIN_MIDDLE_NAME:-}
      ADMIN_PHONE: ${ADMIN_PHONE:-}
      ADMIN_PASSPORT: ${ADMIN_PASSPORT:-ADMIN000000000}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - aviation-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #     target: production
  #   container_name: aviation-frontend
  #   ports:
  #     - "80:80"
  #   depends_on:
  #     - backend
  #   networks:
  #     - aviation-net
  #   restart: unless-stopped
  #   volumes:
  #     - static_files:/var/www/static:ro

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    container_name: aviation-nginx
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - aviation-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  aviation-net:
    driver: bridge

volumes:
  mssql_data: