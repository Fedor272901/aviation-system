services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: aviation-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD}"
      MSSQL_PID: Express
    volumes:
      - mssql_data:/var/opt/mssql
    networks:
      - aviation-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/1433"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 60s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: aviation-app
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_HOURS: ${ACCESS_TOKEN_EXPIRE_HOURS:-24}
      DEBUG: "false"
      APP_NAME: "Aviation System"
      VERSION: "1.0.0"
      CORS_ORIGINS: ${CORS_ORIGINS:-["https://your-domain.com"]}
    depends_on:
      db:
        condition: service_started
    networks:
      - aviation-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  nginx:
    image: nginx:alpine
    container_name: aviation-nginx
    ports:
      - "80:80"
      # - "443:443"  # ← раскомментируйте для production SSL
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # - ./certbot/conf:/etc/letsencrypt:ro  # ← для production
      # - ./certbot/www:/var/www/certbot:ro   # ← для production
      - static_files:/var/www/static:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - aviation-net
    restart: unless-stopped
    # command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"

  # certbot:  # ← раскомментируйте для production
  #   image: certbot/certbot
  #   container_name: aviation-certbot
  #   volumes:
  #     - ./certbot/conf:/etc/letsencrypt
  #     - ./certbot/www:/var/www/certbot
  #   entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
  #   networks:
  #     - aviation-net

networks:
  aviation-net:
    driver: bridge

volumes:
  static_files:
  mssql_data: