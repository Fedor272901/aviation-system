services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: aviation-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD}"
      MSSQL_PID: Express
    volumes:
      - mssql_data:/var/opt/mssql
    networks:
      - aviation-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/1433"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 60s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: aviation-backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_HOURS: ${ACCESS_TOKEN_EXPIRE_HOURS:-24}
      DEBUG: "false"
      APP_NAME: "Aviation System"
      VERSION: "1.0.0"
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173", "http://localhost:80"]}
    depends_on:
      db:
        condition: service_started
    networks:
      - aviation-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - static_files:/var/www/static

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: aviation-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - aviation-net
    restart: unless-stopped
    volumes:
      - static_files:/var/www/static:ro

  # nginx теперь встроен в frontend контейнер
  # Если нужен отдельный nginx для reverse proxy — раскомментируйте
  # nginx:
  #   image: nginx:alpine
  #   container_name: aviation-nginx
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - static_files:/var/www/static:ro
  #   depends_on:
  #     - backend
  #   networks:
  #     - aviation-net
  #   restart: unless-stopped

networks:
  aviation-net:
    driver: bridge

volumes:
  static_files:
  mssql_data: